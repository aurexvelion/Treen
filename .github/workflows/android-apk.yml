name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

env:
  CI: '1'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Check Expo dependency compatibility
        run: npx expo-doctor

      - name: Smoke-test Android JS bundle
        run: npx expo export --platform android --output-dir dist

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TREEN-S25Plus.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TREEN-S25Plus-Android-APK
          path: TREEN-S25Plus.apk
          if-no-files-found: error
          retention-days: 30
